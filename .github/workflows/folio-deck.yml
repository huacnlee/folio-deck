name: Folio Desk

on:
  push:
    branches: [main]
    paths: [apps/folio-deck/**, .github/workflows/folio-deck.yml]
  pull_request:
    paths: [apps/folio-deck/**, .github/workflows/folio-deck.yml]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: apps/folio-deck

jobs:
  installer-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check shell syntax and installer behavior
        run: |
          sh -n install.sh
          node --experimental-vm-modules --test tests/*.test.mjs
          python3 tests/install_test.py

  macos-bundle:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-14, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test OAuth transport and Gmail logic
        run: node --experimental-vm-modules --test tests/*.test.mjs
      - name: Install and upgrade the complete application
        run: |
          sh install.sh --app-source .
          sh install.sh --app-source .
      - name: Verify the native bundle and bundled runtime
        run: |
          test -x ~/Applications/"Folio Desk.app"/Contents/MacOS/applet
          test -x ~/Applications/"Folio Desk.app"/Contents/MacOS/gpui-shell
          test -f ~/Applications/"Folio Desk.app"/Contents/Resources/app/main.js
          test -s ~/Applications/"Folio Desk.app"/Contents/Resources/FolioDesk.icns
          test ! -f ~/Applications/"Folio Desk.app"/Contents/Resources/Assets.car
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIconFile' ~/Applications/"Folio Desk.app"/Contents/Info.plist)" = FolioDesk.icns
          iconutil -c iconset ~/Applications/"Folio Desk.app"/Contents/Resources/FolioDesk.icns -o tests/installed.iconset
          test -f tests/installed.iconset/icon_512x512@2x.png
          plutil -lint ~/Applications/"Folio Desk.app"/Contents/Info.plist
          codesign --verify --deep --strict ~/Applications/"Folio Desk.app"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' ~/Applications/"Folio Desk.app"/Contents/Info.plist
          /usr/libexec/PlistBuddy -c 'Print :CFBundleURLTypes:0:CFBundleURLSchemes:0' ~/Applications/"Folio Desk.app"/Contents/Info.plist
          ~/Applications/"Folio Desk.app"/Contents/MacOS/gpui-shell check -d ~/Applications/"Folio Desk.app"/Contents/Resources/app
          codesign --verify --deep --strict ~/Applications/"Folio Desk.app"
